<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 당끊냥 앱 아이콘 · 샤넬 (턱시도 뚱냥이). 나이브 스타일: 윤곽선 없는 검은 실루엣, 큰 흰 눈, 턱 점·가슴 턱받이·발끝만 하얗게 -->
  <rect width="1024" height="1024" fill="#FFF8E7"/>
  <path d="M520 100c214-14 398 154 414 370 16 220-154 418-374 434C332 920 118 766 100 546 84 328 296 114 520 100z" fill="#DBE9D7"/>
  <!-- 낙서 반짝임 -->
  <path d="M822 214v70M787 249h70M196 736v52M170 762h52M846 690v40M826 710h40" fill="none" stroke="#4A3A2C" stroke-width="12" stroke-linecap="round" opacity=".8"/>
  <clipPath id="blob"><path d="M520 100c214-14 398 154 414 370 16 220-154 418-374 434C332 920 118 766 100 546 84 328 296 114 520 100z"/></clipPath>
  <g clip-path="url(#blob)">
    <!-- 귀: 머리 실루엣과 겹쳐서 틈이 없게 -->
    <path d="M330 430L282 190L480 300ZM694 430L742 190L544 300Z" fill="#2B2724"/>
    <!-- 머리+몸 한 덩어리 -->
    <path d="M512 262C724 262 824 430 852 640C868 760 868 880 858 980L166 980C156 880 156 760 172 640C200 430 300 262 512 262Z" fill="#2B2724"/>
    <!-- 눈 -->
    <circle cx="420" cy="472" r="62" fill="#FFF8E7"/><circle cx="604" cy="472" r="62" fill="#FFF8E7"/>
    <circle cx="430" cy="480" r="30" fill="#2B2724"/><circle cx="614" cy="480" r="30" fill="#2B2724"/>
    <circle cx="442" cy="466" r="9" fill="#FFF8E7"/><circle cx="626" cy="466" r="9" fill="#FFF8E7"/>
    <!-- 코, 턱 점 -->
    <path d="M494 548h36l-18 24z" fill="#FFF8E7"/>
    <path d="M490 596c8-10 36-10 44 0 4 16-8 28-22 28s-26-12-22-28z" fill="#FFF8E7"/>
    <!-- 수염 -->
    <path d="M372 556l-130 -16M372 582l-130 14M652 556l130 -16M652 582l130 14" fill="none" stroke="#FFF8E7" stroke-width="8" stroke-linecap="round"/>
    <!-- 큼직한 가슴 턱받이 (역삼각, 복슬복슬) -->
    <path d="M386 668c34 26 80 40 126 40s92-14 126-40c-6 64-30 118-60 156-24 30-48 46-66 46s-42-16-66-46c-30-38-54-92-60-156z" fill="#FFF8E7"/>
    <!-- 쿠키를 든 앞발 -->
    <g transform="translate(512 816) rotate(-6)">
      <path d="M-62 -54l10 -44 30 24h44l30 -24 10 44c20 40 10 112-62 112s-82 -72 -62 -112z" fill="#EAD9C6"/>
      <circle cx="-20" cy="-2" r="6" fill="#B49A80"/><circle cx="20" cy="-2" r="6" fill="#B49A80"/>
      <path d="M-10 18q10 10 20 0" fill="none" stroke="#B49A80" stroke-width="5" stroke-linecap="round"/>
    </g>
        <!-- 하얀 발끝 -->
    <path d="M366 866c0-28 24-46 54-46s54 18 54 46c-32 16-76 16-108 0zM550 866c0-28 24-46 54-46s54 18 54 46c-32 16-76 16-108 0z" fill="#FFF8E7"/>
    <!-- 꼬리 -->
    <path d="M836 840C950 820 960 700 880 670" fill="none" stroke="#2B2724" stroke-width="58" stroke-linecap="round"/>
  </g>
</svg>
